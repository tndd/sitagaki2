[project]
name = "sitagaki2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.1",
    "nbformat>=5.10.4",
    "numpy==1.26.4",
    "pandas>=2.2.3",
    "pandas-ta>=0.3.14b0",
    "plotly>=6.0.0",
    "polars>=1.24.0",
    "pyarrow>=19.0.1",
    "pytest>=8.3.5",
    "ruff>=0.9.9",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "setuptools>=75.9.1",
]

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
