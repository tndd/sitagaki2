[project]
name = "sitagaki2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "nbformat>=5.10.4",
    "pandas>=2.2.3",
    "plotly>=6.0.0",
    "polars>=1.24.0",
    "pytest>=8.3.5",
    "ruff>=0.9.9",
]

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
